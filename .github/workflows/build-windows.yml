name: build-windows

# 手动触发；改这个 workflow 或构建脚本时也跑一次（方便验证改动真的能构建）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'tooling/build-windows.sh'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # ATL 是 flutter_secure_storage 的 Windows 实现（CString/CW2A）的硬依赖。
      # 托管 runner 的 VS 可能装在 "Program Files"（Enterprise）而不是
      # "Program Files (x86)"（BuildTools），所以位置一律用 vswhere 问，别写死。
      - name: ensure ATL (Visual C++ ATL)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere: $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw '没有带 C++ 工作负载的 Visual Studio' }
          "VS: $vs"
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlstr.h" -ErrorAction SilentlyContinue
          if ($atl) { "ATL 已存在: $($atl[0].FullName)"; exit 0 }
          "没有 ATL，用 VS Installer 补装"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList @(
            'modify', '--installPath', "$vs",
            '--add', 'Microsoft.VisualStudio.Component.VC.ATL',
            '--quiet', '--norestart', '--nocache'
          ) -Wait -PassThru
          "vs installer exit: $($p.ExitCode)"
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlstr.h" -ErrorAction SilentlyContinue
          if (-not $atl) { throw 'ATL 安装后仍找不到 atlstr.h' }
          "ATL 就绪: $($atl[0].FullName)"

      # 运行时归档 184 MB：按脚本/锁/补丁/桥的哈希缓存，命中就不用重建。
      - name: Cache runtime archive
        uses: actions/cache@v4
        with:
          path: |
            app/assets/runtime-windows/runtime-x64.tar.gz
            runtime/.cache
          key: runtime-win-r1-${{ hashFiles('runtime/build-runtime-desktop.sh', 'runtime/locks/**', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/lib/rtbuild.py') }}
          restore-keys: |
            runtime-win-r1-

      - name: build runtime archive
        shell: bash
        run: |
          # 归档是 184 MB 的构建产物，不进 git；没有就现场建（约 3-5 分钟，有缓存更快）。
          if [[ ! -f app/assets/runtime-windows/runtime-x64.tar.gz ]]; then
            PYTHON=python bash runtime/build-runtime-desktop.sh --platform windows
          fi
          ls -lh app/assets/runtime-windows/runtime-x64.tar.gz
          grep -q '"runtimeVersion": "desktop-win-r1"' app/assets/runtime-windows/manifest.json

      - name: build zip
        shell: bash
        run: bash tooling/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-windows-zip
          path: |
            app/build/windows/*.zip
            app/build/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
